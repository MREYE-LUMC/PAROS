name: Continuous Integration

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: &python-versions ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Build PAROS
        run: uvx --python ${{ matrix.python }} hatch build

  format:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Format and lint
        run: uvx hatch check

  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: *python-versions
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Run tests
        run: uvx --python ${{ matrix.python }} hatch test
    
  jupyter:
    name: Test Jupyter notebooks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: *python-versions
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        id: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Format and lint
        run: uvx --python ${{ matrix.python }} hatch run jupyter:run-all
